name: oidc-target
# Test: can a pull_request_target job on dev use the dev-only "Factory Review"
# environment, and what does its GitHub OIDC token say? Prints claims, never the token.
on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    environment: Factory Review
    steps:
      - name: Print OIDC claims (not the token)
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          body = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
          for key in ("sub", "aud", "ref", "environment", "event_name", "workflow", "job_workflow_ref", "repository", "repository_id", "repository_owner_id"):
              print(f"{key} = {claims.get(key)}")
          PY
