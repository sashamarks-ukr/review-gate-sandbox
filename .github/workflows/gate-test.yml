name: gate-test
# Scratch test (branch only, never merged): does a check run created from a
# pull_request_review workflow land on the PR head commit?
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  checks: write
  contents: read
  pull-requests: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Post review-evidence on the PR head commit
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const passed = context.eventName === 'pull_request_review';
            core.info(`event=${context.eventName} GITHUB_SHA=${process.env.GITHUB_SHA} head=${pr.head.sha}`);
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'review-evidence', head_sha: pr.head.sha, status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              output: { title: passed ? 'review seen' : 'waiting for review',
                        summary: `event=${context.eventName} GITHUB_SHA=${process.env.GITHUB_SHA}` },
            });
